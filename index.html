<!doctype html>
<html lang="zh-CN" data-theme="midnight-gold">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #08091a;
        color: rgba(245, 243, 255, 0.96);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }

      .vm-startup {
        min-height: 100%;
        display: grid;
        place-items: center;
      }

      .vm-startup__card {
        width: min(420px, calc(100vw - 48px));
        padding: 34px 38px;
        border: 1px solid rgba(212, 160, 53, 0.18);
        border-radius: 28px;
        background: rgba(18, 21, 50, 0.92);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
        text-align: center;
      }

      .vm-startup__brand {
        margin: 0 0 12px;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: rgba(245, 243, 255, 0.96);
      }

      .vm-startup__title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        color: #f0c050;
      }

      .vm-startup__hint {
        margin: 12px 0 0;
        font-size: 14px;
        line-height: 1.7;
        color: #b0aed0;
      }

      .vm-startup__bar {
        position: relative;
        overflow: hidden;
        height: 5px;
        margin-top: 24px;
        border-radius: 999px;
        background: rgba(212, 160, 53, 0.15);
      }

      .vm-startup__bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, #d4a035, #f0c050);
        animation: vm-startup-slide 1.25s ease-in-out infinite;
      }

      @keyframes vm-startup-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(240%);
        }
      }
    </style>
    <title>厉影AI混剪智能体</title>
  </head>
  <body>
    <div id="app">
      <div class="vm-startup" aria-label="正在启动">
        <div class="vm-startup__card">
          <p class="vm-startup__brand">厉影AI混剪智能体</p>
          <p class="vm-startup__title">正在启动，请稍候</p>
          <p class="vm-startup__hint">首次打开需要准备本地合成服务，请稍等片刻。</p>
          <div class="vm-startup__bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
